services:
  backend:
    build:
      context: ./app
    image: cicd-project-backend:latest
    container_name: devops-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: devops-postgres
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops_password
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build:
      context: ./app
    command: pytest
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  jenkins_home: